# Temporary branch-only QA; removed after a passing run.
name: Browser smoke test

on:
  push:
    branches:
      - revenue-ready-v1

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revenue-ready-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real browser smoke test
        run: |
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true, args: ['--autoplay-policy=no-user-gesture-required'] });
          const context = await browser.newContext({ acceptDownloads: true, viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });

          const started = Date.now();
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          const loadMs = Date.now() - started;
          assert.match(await page.title(), /Nick Berghane/);
          await page.waitForSelector('#page-home:not(.hidden)');
          assert.equal(await page.locator('#global-nav-links').count(), 1);
          const duplicateIds = await page.evaluate(() => {
            const ids = [...document.querySelectorAll('[id]')].map(el => el.id);
            return [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
          });
          assert.deepEqual(duplicateIds, []);

          fs.writeFileSync('/tmp/evidence.txt', 'ChronosAudit smoke test evidence\n');
          await page.locator('#file-input').setInputFiles('/tmp/evidence.txt');
          const hashCell = page.locator('#crypto-table-body tr td').nth(2);
          await hashCell.waitFor({ state: 'visible' });
          const hash = (await hashCell.textContent()).trim();
          assert.match(hash, /^[a-f0-9]{64}$/);
          const downloadPromise = page.waitForEvent('download');
          await page.getByRole('button', { name: 'Download Evidence Manifest' }).click();
          const manifestDownload = await downloadPromise;
          assert.match(manifestDownload.suggestedFilename(), /^chronosaudit-manifest-.*\.json$/);

          await page.locator('#nav-mixer').click();
          await page.waitForSelector('#page-mixer:not(.hidden)');
          assert.equal(await page.locator('input[type=file][accept="audio/*"]').count(), 4);
          await page.getByRole('button', { name: 'Build Demo Arrangement' }).click();
          await page.waitForFunction(() => document.querySelector('#stem-name-vocals')?.textContent?.includes('Generated demo'));
          await page.locator('#btn-mixer-master-toggle').click();
          await page.waitForFunction(() => document.querySelector('#daw-engine-status-lbl')?.textContent?.includes('Playing loaded stems in sync'));
          await page.locator('#slider-fx-cutoff').fill('2400');
          assert.equal(await page.locator('#lbl-fx-cutoff').first().textContent(), '2400 Hz');
          await page.getByRole('button', { name: 'Stop', exact: true }).click();
          const wavPromise = page.waitForEvent('download');
          await page.getByRole('button', { name: 'Export WAV', exact: true }).click();
          const wavDownload = await wavPromise;
          assert.match(wavDownload.suggestedFilename(), /^wollohy-mix-.*\.wav$/);

          await page.locator('#nav-playgrounds').click();
          await page.waitForSelector('#page-playgrounds:not(.hidden)');
          await page.locator('#aim-user-input').fill('<img src=x onerror=alert(1)> hello');
          await page.getByRole('button', { name: 'Send IM' }).click();
          assert.equal(await page.locator('#aim-message-box img').count(), 0);
          assert.match(await page.locator('#aim-message-box').textContent(), /<img src=x/);

          await page.getByRole('button', { name: 'Start a Project' }).click();
          await page.waitForSelector('#modal-consultation.flex');
          await page.locator('#lead-name').fill('Smoke Tester');
          await page.locator('#lead-email').fill('test@example.com');
          await page.locator('#lead-summary').fill('Build a reliable local-first browser prototype.');
          await page.locator('#scope-options input[type=checkbox]').first().check();
          assert.notEqual((await page.locator('#lbl-calc-budget').textContent()).trim(), 'Select a scope');
          await page.getByRole('button', { name: 'Copy Brief' }).click();
          await page.getByRole('button', { name: 'Close project inquiry' }).click();

          await page.locator('#nav-geometry').click();
          await page.waitForSelector('#page-geometry:not(.hidden)');
          assert.ok(await page.locator('#physics-canvas').evaluate(canvas => canvas.width > 0 && canvas.height > 0));
          await page.setViewportSize({ width: 390, height: 844 });
          await page.waitForTimeout(100);
          assert.ok(await page.locator('#mobile-nav-select').isVisible());
          await page.locator('#mobile-nav-select').selectOption('about');
          await page.waitForSelector('#page-about:not(.hidden)');
          assert.ok(await page.getByRole('button', { name: 'Scope a Project' }).isVisible());

          await page.screenshot({ path: 'smoke-mobile.png', fullPage: true });
          await page.setViewportSize({ width: 1440, height: 1000 });
          await page.screenshot({ path: 'smoke-desktop.png', fullPage: true });

          if (errors.length) throw new Error(`Browser errors:\n${errors.join('\n')}`);
          console.log(JSON.stringify({ loadMs, hashLength: hash.length, result: 'PASS' }, null, 2));
          await browser.close();
          JS
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node smoke.mjs

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revenue-ready-browser-smoke
          path: |
            smoke-mobile.png
            smoke-desktop.png
          if-no-files-found: ignore
