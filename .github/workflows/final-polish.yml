name: Apply final portfolio polish

on:
  push:
    branches:
      - revenue-ready-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revenue-ready-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply structural and copy polish
        run: python scripts/final_polish.py

      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class Balance(HTMLParser):
              pass

          text = Path('index.html').read_text(encoding='utf-8')
          Balance().feed(text)
          assert '\\1' not in text and '\\2' not in text
          assert text.count('id="page-home"') == 1
          assert text.count('id="page-mixer"') == 1
          assert 'Local Hash &amp; Manifest Demo' in text
          assert 'Interaction Labs' in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          Path('/tmp/site-scripts.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          print(f'Validated {len(text):,} HTML characters.')
          PY
          node --check /tmp/site-scripts.js

      - name: Commit final audited build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix view nesting and finish revenue-ready polish"
          git push origin revenue-ready-v1
