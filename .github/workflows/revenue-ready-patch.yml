name: Revenue-ready one-shot patch

on:
  push:
    branches:
      - revenue-ready-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: revenue-ready-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble and run the one-shot patch
        run: |
          cat scripts/patchparts/part_* > scripts/revenue_ready_patch.py
          python scripts/revenue_ready_patch.py
          rm -rf scripts/patchparts

      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          assert text.startswith('<!DOCTYPE html>')
          assert text.count('<html') == 1
          assert text.count('</html>') == 1
          assert 'https://jsdelivr.net' not in text
          assert 'SYNC ACTIVE (POSTGRES LIVE LINKED)' not in text
          assert 'MusicGen-Small ONNX' not in text
          assert 'modal-usage-gate' not in text
          assert 'modal-premium-export' not in text
          assert 'Load Audio Stem' in text
          assert 'Download Evidence Manifest' in text
          assert 'Start a Project' in text

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          Path('/tmp/site-scripts.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          print(f'Validated {len(text):,} HTML characters and extracted {len(scripts)} script blocks.')
          PY
          node --check /tmp/site-scripts.js

      - name: Commit audited build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revenue-ready audit: real tools, honest copy, conversion flow"
          git push origin revenue-ready-v1
