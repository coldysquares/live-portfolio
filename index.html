<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1e7"><title>ChronosAudit</title><style>html,body{height:100%;margin:0;background:#f6f1e7;color:#182126;font:15px/1.5 system-ui,sans-serif}body{display:grid;place-items:center}.boot{text-align:center}.mark{font:34px Georgia,serif;color:#a84d36}.note{color:#74766f;font-size:12px}</style></head><body><div class="boot"><div class="mark">ChronosAudit</div><div class="note" id="status">Opening the sample investigation…</div></div><script>(async()=>{try{if(!('DecompressionStream' in window))throw new Error('This preview needs a browser with DecompressionStream support.');const parts=await Promise.all(Array.from({length:8},(_,i)=>fetch(`/payload.${i}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`payload ${i}: ${r.status}`);return r.text()})));const b64=parts.join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){console.error(e);document.getElementById('status').textContent='Preview could not open: '+e.message;}})();</script></body></html>
